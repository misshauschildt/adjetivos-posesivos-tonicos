rid-template-columns:1fr}.b{font-size:22px}}</style></head><body><div class="w"><div class="f"><div class="t">Adjetivos posesivos tónicos</div><div id="p" class="p"></div><section id="qs" class="s a"><div id="q" class="q"></div><div id="o" class="o"></div></section><section id="cs" class="s"><div class="h c">¡Correcto!</div><div class="ck">✓</div><div id="ca" class="x ans"></div><div id="cr" class="x"></div><button id="nx" class="go n">Continuar</button></section><section id="ws" class="s"><div class="h r">Inténtalo de nuevo</div><div id="wr" class="x"></div><button id="re" class="go y">Intentar otra vez</button></section><section id="ds" class="s"><div class="h c">¡Terminaste!</div><div id="sc" class="h"></div><button id="rs" class="go n">Practicar otra vez</button></section></div></div><script>const Q=[{"q":"—¿Es tuyo este peine?\n—Sí, es _____.","a":"mío","why":"Peine is masculine singular. The person answering says it belongs to them, so use mío."},{"q":"—¿Son tuyas estas toallas?\n—Sí, son _____.","a":"mías","why":"Toallas is feminine plural. The person answering says they belong to them, so use mías."},{"q":"—¿Es de Claudia este champú?\n—Sí, es _____.","a":"suyo","why":"Champú is masculine singular and belongs to Claudia, so use suyo."},{"q":"—¿Son de Javier estos cepillos de dientes?\n—Sí, son _____.","a":"suyos","why":"Cepillos is masculine plural and belongs to Javier, so use suyos."},{"q":"—¿Es de nosotros esta toalla?\n—Sí, es _____.","a":"nuestra","why":"Toalla is feminine singular and belongs to nosotros, so use nuestra."},{"q":"—¿Son de nosotros estos peines?\n—Sí, son _____.","a":"nuestros","why":"Peines is masculine plural and belongs to nosotros, so use nuestros."},{"q":"—¿Es tuya esta mochila?\n—Sí, es _____.","a":"mía","why":"Mochila is feminine singular. The person answering says it belongs to them, so use mía."},{"q":"—¿Son tuyos estos zapatos?\n—Sí, son _____.","a":"míos","why":"Zapatos is masculine plural. The person answering says they belong to them, so use míos."},{"q":"—¿Es de ella este maquillaje?\n—Sí, es _____.","a":"suyo","why":"Maquillaje is masculine singular and belongs to ella, so use suyo."},{"q":"—¿Son de ellas estas cámaras?\n—Sí, son _____.","a":"suyas","why":"Cámaras is feminine plural and belongs to ellas, so use suyas."},{"q":"—Lucía, ¿quieres usar mi secador de pelo?\n—Gracias, pero voy a usar el _____. Mi hermana me lo prestó.","a":"suyo","why":"Secador is masculine singular, and it belongs to Lucía's sister, so use suyo."},{"q":"—Mateo, ¿esa toalla azul es tuya?\n—No, no es _____. La toalla azul es de Carlos.","a":"mía","why":"Toalla is feminine singular. Mateo is saying it is not his, so use mía."},{"q":"—¿Y esos zapatos deportivos? ¿Son de tu hermano?\n—No, no son _____. ¡Son míos!","a":"suyos","why":"Zapatos is masculine plural. The question asks whether they belong to his brother, so use suyos."},{"q":"—Creo que Ana ya llegó. ¿Ese maquillaje es de ella?\n—Sí, es _____. Está en el baño.","a":"suyo","why":"Maquillaje is masculine singular and belongs to Ana, so use suyo."},{"q":"—¿Esta cámara es de Claudia y Rosa?\n—Sí, es _____. Quieren sacar fotos después de arreglarse.","a":"suya","why":"Cámara is feminine singular and belongs to Claudia and Rosa, so use suya."},{"q":"—¿Quieren usar nuestro champú después de la práctica?\n—Gracias, pero usamos el _____. Lo compró Javier.","a":"suyo","why":"Champú is masculine singular and belongs to Javier, so use suyo."},{"q":"—Sofía, ¿este cepillo de dientes es tuyo?\n—No, no es _____. El mío está al lado del jabón.","a":"mío","why":"Cepillo is masculine singular. Sofía says the one shown is not hers, so use mío."},{"q":"—¿Son de tus amigas estas toallas?\n—Sí, son _____. Las necesitan después de ducharse.","a":"suyas","why":"Toallas is feminine plural and belongs to the friends, so use suyas."},{"q":"—Diego, ¿ese peine negro es de tu papá?\n—Sí, es _____. Mi peine es azul.","a":"suyo","why":"Peine is masculine singular and belongs to Diego's father, so use suyo."},{"q":"—Marta y yo necesitamos un espejo. ¿Este es de nosotros?\n—Sí, es _____. Está junto al maquillaje.","a":"nuestro","why":"Espejo is masculine singular and belongs to nosotros, so use nuestro."},{"q":"—¿Es de ti este gel?\n—Sí, es _____.","a":"mío","why":"Gel is masculine singular. The person answering says it belongs to them, so use mío."},{"q":"—¿Son de ti estas sandalias?\n—Sí, son _____.","a":"mías","why":"Sandalias is feminine plural. The person answering says they belong to them, so use mías."},{"q":"—¿Es de Paulo esta corbata?\n—Sí, es _____.","a":"suya","why":"Corbata is feminine singular and belongs to Paulo, so use suya."},{"q":"—¿Son de Miriam estos pantalones?\n—Sí, son _____.","a":"suyos","why":"Pantalones is masculine plural and belongs to Miriam, so use suyos."},{"q":"—¿Es de Javier este coche?\n—Sí, es _____.","a":"suyo","why":"Coche is masculine singular and belongs to Javier, so use suyo."},{"q":"—¿Son de Claudia estas gafas?\n—Sí, son _____.","a":"suyas","why":"Gafas is feminine plural and belongs to Claudia, so use suyas."},{"q":"—¿Es de nosotros esta casa?\n—Sí, es _____.","a":"nuestra","why":"Casa is feminine singular and belongs to nosotros, so use nuestra."},{"q":"—¿Son de nosotros estos libros?\n—Sí, son _____.","a":"nuestros","why":"Libros is masculine plural and belongs to nosotros, so use nuestros."},{"q":"—¿Es de mí este cinturón?\n—Sí, es _____.","a":"mío","why":"Cinturón is masculine singular and belongs to yo, so use mío."},{"q":"—¿Son de mí estas camisetas?\n—Sí, son _____.","a":"mías","why":"Camisetas is feminine plural and belongs to yo, so use mías."},{"q":"—¿De quién es este despertador? ¿Es de Javier?\n—Sí, es _____. Lo usa para despertarse temprano.","a":"suyo","why":"Despertador is masculine singular and belongs to Javier, so use suyo."},{"q":"—¿De quiénes son estas toallas? ¿Son de Ana y Marta?\n—Sí, son _____. Las usan después de ducharse.","a":"suyas","why":"Toallas is feminine plural and belongs to Ana and Marta, so use suyas."},{"q":"—¿Ese jabón es tuyo?\n—No, no es _____. Es de mi hermano.","a":"mío","why":"Jabón is masculine singular. The person answering says it is not theirs, so use mío."},{"q":"—¿Esta crema de afeitar es de tu papá?\n—Sí, es _____. La usa por la mañana.","a":"suya","why":"Crema is feminine singular and belongs to the father, so use suya."},{"q":"—¿Son de Claudia estos zapatos?\n—No, no son _____. Son de Elena.","a":"suyos","why":"Zapatos is masculine plural. The sentence refers to Claudia's possession, so use suyos."},{"q":"—¿Esta cámara es de Diego y Mateo?\n—No, no es _____. Es de nuestros amigos.","a":"suya","why":"Cámara is feminine singular. The sentence asks whether it belongs to Diego and Mateo, so use suya."},{"q":"—¿Es de él este cepillo?\n—Sí, es _____.","a":"suyo","why":"Cepillo is masculine singular and belongs to él, so use suyo."},{"q":"—¿Son de ella estas joyas?\n—Sí, son _____.","a":"suyas","why":"Joyas is feminine plural and belongs to ella, so use suyas."},{"q":"—¿Es de ti esta cadena?\n—No, no es _____. Es de mi prima.","a":"mía","why":"Cadena is feminine singular. The person answering says it is not theirs, so use mía."},{"q":"—¿Son de ti estos aretes?\n—Sí, son _____.","a":"míos","why":"Aretes is masculine plural. The person answering says they belong to them, so use míos."},{"q":"—¿Este espejo es de nosotros?\n—Sí, es _____.","a":"nuestro","why":"Espejo is masculine singular and belongs to nosotros, so use nuestro."},{"q":"—¿Estas mochilas son de nosotros?\n—Sí, son _____.","a":"nuestras","why":"Mochilas is feminine plural and belongs to nosotros, so use nuestras."},{"q":"—¿Ese secador de pelo es de ella?\n—Sí, es _____.","a":"suyo","why":"Secador is masculine singular and belongs to ella, so use suyo."},{"q":"—¿Esas toallas son de ellos?\n—Sí, son _____.","a":"suyas","why":"Toallas is feminine plural and belongs to ellos, so use suyas."},{"q":"—¿Este maquillaje es tuyo?\n—Sí, es _____. Lo uso para maquillarme.","a":"mío","why":"Maquillaje is masculine singular. The person answering says it belongs to them, so use mío."},{"q":"—¿Estas pulseras son tuyas?\n—Sí, son _____.","a":"mías","why":"Pulseras is feminine plural. The person answering says they belong to them, so use mías."},{"q":"—¿Ese collar es de Javier?\n—No, no es _____. Es de Paulo.","a":"suyo","why":"Collar is masculine singular. The sentence refers to Javier's possession, so use suyo."},{"q":"—¿Estas faldas son de Ana?\n—Sí, son _____.","a":"suyas","why":"Faldas is feminine plural and belongs to Ana, so use suyas."},{"q":"—¿Este jabón es de nosotros?\n—Sí, es _____.","a":"nuestro","why":"Jabón is masculine singular and belongs to nosotros, so use nuestro."},{"q":"—¿Estas cámaras son de nosotros?\n—Sí, son _____.","a":"nuestras","why":"Cámaras is feminine plural and belongs to nosotros, so use nuestras."}];const D={"mío":["tuyo","suyo","nuestro"],"mía":["tuya","suya","nuestra"],"míos":["tuyos","suyos","nuestros"],"mías":["tuyas","suyas","nuestras"],"tuyo":["mío","suyo","nuestro"],"tuya":["mía","suya","nuestra"],"tuyos":["míos","suyos","nuestros"],"tuyas":["mías","suyas","nuestras"],"suyo":["mío","tuyo","nuestro"],"suya":["mía","tuya","nuestra"],"suyos":["míos","tuyos","nuestros"],"suyas":["mías","tuyas","nuestras"],"nuestro":["mío","tuyo","suyo"],"nuestra":["mía","tuya","suya"],"nuestros":["míos","tuyos","suyos"],"nuestras":["mías","tuyas","suyas"]};let A=[],i=0,score=0;const $=x=>document.getElementById(x),sh=x=>{document.querySelectorAll('.s').forEach(e=>e.classList.remove('a'));$(x).classList.add('a')},mix=a=>{a=[...a];for(let k=a.length-1;k;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};function start(){A=mix(Q);i=0;score=0;show()}function show(){let z=A[i];$('p').textContent=`Pregunta ${i+1} de ${A.length}`;$('q').textContent=z.q;let o=$('o');o.innerHTML='';mix([z.a,...D[z.a]]).forEach(v=>{let b=document.createElement('button');b.className='b';b.textContent=v;b.onclick=()=>pick(v);o.appendChild(b)});sh('qs')}function pick(v){let z=A[i];if(v===z.a){score++;$('ca').textContent=z.q.replace('_____',z.a);$('cr').textContent=z.why;sh('cs')}else{$('wr').textContent=z.why;sh('ws')}}$('re').onclick=show;$('nx').onclick=()=>{if(++i>=A.length){$('p').textContent='';$('sc').textContent=`${score} / ${A.length}`;sh('ds')}else show()};$('rs').onclick=start;start();</script></body></html>
