<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adjetivos posesivos tónicos</title><style>:root{--b:#2365c7;--g:#2e9b50;--r:#cf3f4f}*{box-sizing:border-box}body{margin:0;font-family:"Century Gothic",Arial,sans-serif;background:#eaf3ff;color:#111827}.wrap{max-width:1100px;margin:auto;padding:24px}.frame{background:#fff;border:10px solid #78aaf0;border-radius:32px;box-shadow:0 14px 36px #204f9138;min-height:720px;position:relative;overflow:hidden}.frame:before,.frame:after{content:"";position:absolute;border:4px solid #c7ddff;border-radius:45%;width:250px;height:90px;transform:rotate(-18deg);opacity:.65}.frame:before{top:18px;left:-80px}.frame:after{bottom:15px;right:-90px}.top{padding:24px 34px 14px;text-align:center;color:var(--b);font-weight:700;font-size:27px}.prog{text-align:right;padding:0 34px;color:#64748b;font-size:15px}.screen{display:none;padding:34px 42px 46px;position:relative;z-index:2}.screen.active{display:block}.q{white-space:pre-line;font-size:30px;line-height:1.55;font-weight:700;text-align:center;background:#fff;border:3px solid #d7e7ff;border-radius:20px;padding:26px 24px;min-height:190px;display:flex;align-items:center;justify-content:center}.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:34px auto 0;max-width:840px}.opt{background:#eef6ff;border:3px solid var(--b);border-radius:18px;padding:20px;font-size:25px;font-weight:700;color:#173b74;cursor:pointer;min-height:82px}.opt:hover{background:#deedff;transform:translateY(-1px)}.ft{font-size:40px;font-weight:800;text-align:center;margin:10px 0 24px}.ct{color:var(--g)}.wt{color:var(--r)}.check{width:110px;height:110px;border-radius:50%;background:#eaf8ef;border:6px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:68px;color:var(--g);font-weight:900;margin:0 auto 28px}.abox,.rbox{max-width:850px;margin:18px auto;border-radius:18px;padding:22px 26px;font-size:23px;line-
